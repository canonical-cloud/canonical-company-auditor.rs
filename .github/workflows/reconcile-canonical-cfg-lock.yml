name: One-shot canonical cfg lock reconciliation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/reconcile-canonical-cfg-lock.yml"

permissions:
  contents: write

jobs:
  reconcile-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Apply minimal audited lock change
        shell: python
        run: |
          from pathlib import Path
          path = Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")
          package_start = text.index('[[package]]\nname = "canonical-company-auditor"')
          package_end = text.index('\n[[package]]', package_start + 1)
          package = text[package_start:package_end]
          if ' "toml",\n' not in package:
              package = package.replace(' "tokio",\n', ' "tokio",\n "toml",\n')
              text = text[:package_start] + package + text[package_end:]
          if '\nname = "toml"\nversion = "0.5.11"\n' not in text:
              block = '''[[package]]
          name = "toml"
          version = "0.5.11"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "f4f7f0dd8d50a853a531c426359045b1998f04219d88799810762cd4ad314234"
          dependencies = [
           "serde",
          ]

          '''
              tower = text.index('[[package]]\nname = "tower"')
              text = text[:tower] + block + text[tower:]
          path.write_text(text, encoding="utf-8")
      - name: Prove minimal lock is accepted
        run: cargo check --locked
      - name: Commit only the verified lockfile through GitHub API
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already reconciled"
            exit 0
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock?ref=${HEAD_REF}" --jq .sha)"
          content="$(base64 -w0 Cargo.lock)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock" \
            -f message='build: lock canonical audit config parser' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch="$HEAD_REF" >/dev/null
