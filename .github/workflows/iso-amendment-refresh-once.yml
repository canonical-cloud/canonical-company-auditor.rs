name: one-shot ISO amendment metadata refresh

on:
  push:
    branches: [audit/iso-amendment-freshness-20260915]
    paths:
      - '.github/workflows/iso-amendment-refresh-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-amendment-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'canonical-cloud/canonical-company-auditor.rs' && github.ref == 'refs/heads/audit/iso-amendment-freshness-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/iso-amendment-freshness-20260915
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh ISO framework metadata and regression coverage
        shell: python
        run: |
          import json
          from pathlib import Path

          program_path = Path('programs/baseline-v1.json')
          program = json.loads(program_path.read_text(encoding='utf-8'))
          iso = next(
              (framework for framework in program['frameworks']
               if framework.get('id') == 'iso-iec-27001-2022'),
              None,
          )
          if iso is None:
              raise SystemExit('ISO/IEC 27001 profile missing')
          iso['version'] = '2022 + Amd 1:2024'
          iso['sourceUrl'] = 'https://www.iso.org/standard/27001'
          iso['statusNote'] = (
              'Profile metadata includes the published ISO/IEC 27001:2022/Amd 1:2024 '
              'amendment; certification requires an accredited certification body.'
          )
          program_path.write_text(
              json.dumps(program, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/e2e.rs')
          text = test_path.read_text(encoding='utf-8')
          if 'fn iso_profile_tracks_published_2024_amendment' not in text:
              marker = (
                  '\n#[test]\n'
                  'fn iso_profile_tracks_published_2024_amendment() -> Result<(), Box<dyn Error>> {\n'
                  '    let program: serde_json::Value =\n'
                  '        serde_json::from_str(include_str!("../programs/baseline-v1.json"))?;\n'
                  '    let frameworks = program["frameworks"]\n'
                  '        .as_array()\n'
                  '        .ok_or("frameworks must be an array")?;\n'
                  '    let iso = frameworks\n'
                  '        .iter()\n'
                  '        .find(|framework| framework["id"].as_str() == Some("iso-iec-27001-2022"))\n'
                  '        .ok_or("ISO/IEC 27001 profile missing")?;\n\n'
                  '    assert_eq!(iso["version"].as_str(), Some("2022 + Amd 1:2024"));\n'
                  '    assert_eq!(\n'
                  '        iso["sourceUrl"].as_str(),\n'
                  '        Some("https://www.iso.org/standard/27001")\n'
                  '    );\n'
                  '    assert!(\n'
                  '        iso["statusNote"]\n'
                  '            .as_str()\n'
                  '            .is_some_and(|note| note.contains("ISO/IEC 27001:2022/Amd 1:2024"))\n'
                  '    );\n'
                  '    Ok(())\n'
                  '}\n'
              )
              test_path.write_text(text.rstrip() + '\n' + marker, encoding='utf-8')

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Validate exact durable change
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool programs/baseline-v1.json >/dev/null
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 test --locked --all-targets
          cargo +1.95.0 clippy --locked --all-targets -- -D warnings
          git diff --check

      - name: Commit verified framework freshness change
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- programs/baseline-v1.json tests/e2e.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'readiness: account for ISO 27001 amendment 1:2024'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish verified change
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/audit/iso-amendment-freshness-20260915
