name: One-shot canonical cfg rustfmt reconciliation

on:
  pull_request:
    paths:
      - "src/audit_config.rs"
      - "src/app.rs"
      - ".github/workflows/reconcile-canonical-cfg-rustfmt.yml"

permissions:
  contents: write

jobs:
  reconcile-rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply rustfmt and constrain touched files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              src/app.rs|src/audit_config.rs) ;;
              *) echo "unexpected rustfmt change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit only rustfmt output through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for path in src/app.rs src/audit_config.rs; do
            if git diff --quiet -- "$path"; then
              continue
            fi
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${HEAD_REF}" --jq .sha)"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='style: apply rustfmt to audit config runtime' \
              -f content="$content" \
              -f sha="$sha" \
              -f branch="$HEAD_REF" >/dev/null
          done
