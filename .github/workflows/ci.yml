name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-company-auditor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository policy
        run: python3 scripts/check-repository-policy.py
      - name: Verify readiness peer-authority policy
        run: python3 scripts/check-readiness-contract.py
      - name: Validate GitHub Actions syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml

  contracts:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          typespec: readiness/contract/main.tsp
          schema: readiness/response.schema.json
          report: .typespec-json-schema-validator/readiness-report.json
          contract_ir: .typespec-json-schema-validator/readiness-contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          instances: readiness/contract/instances
          max_probes: "128"
          quiet: "false"
      - name: Show public union witness when peer parity stops
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.typespec-json-schema-validator/generated/typespec.generated.schema.json')
          if not path.is_file():
              print('comparison witness was not produced')
              raise SystemExit(0)
          schema = json.loads(path.read_text(encoding='utf-8'))
          answer = schema.get('$defs', {}).get('ReadinessAnswer', {})
          response = schema.get('$defs', {}).get('ReadinessResponse', {})
          print(json.dumps({
              'ReadinessAnswer': {
                  key: answer.get('properties', {}).get(key)
                  for key in ('evidenceRef', 'evidenceDate', 'dueDate')
              },
              'ReadinessResponse': {
                  key: response.get('properties', {}).get(key)
                  for key in ('schemaVersion', 'catalogVersion')
              },
          }, indent=2, sort_keys=True))
          PY
      - name: Verify exact Contract IR before consumer admission
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          contract_ir: .typespec-json-schema-validator/readiness-contract-ir.json
          report: .typespec-json-schema-validator/readiness-report.json
          typespec: readiness/contract/main.tsp
          schema: readiness/response.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalReadiness.DateString","CanonicalReadiness.FrameworkId","CanonicalReadiness.Identifier","CanonicalReadiness.ReadinessAnswer","CanonicalReadiness.ReadinessContext","CanonicalReadiness.ReadinessResponse","CanonicalReadiness.ReadinessStatus"]'
          verification: .typespec-json-schema-validator/readiness-consumer-verification.json
      - name: Prove altered evidence and incomplete scopes fail closed
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          contract_ir: .typespec-json-schema-validator/readiness-contract-ir.json
          report: .typespec-json-schema-validator/readiness-report.json
          typespec: readiness/contract/main.tsp
          schema: readiness/response.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalReadiness.DateString","CanonicalReadiness.FrameworkId","CanonicalReadiness.Identifier","CanonicalReadiness.ReadinessAnswer","CanonicalReadiness.ReadinessContext","CanonicalReadiness.ReadinessResponse","CanonicalReadiness.ReadinessStatus"]'
          verification: .typespec-json-schema-validator/readiness-regression-verification.json

  test:
    needs: policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: canonical-company-auditor-${{ matrix.os }}
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release

  probes:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python runtime probe self-test
        run: CANONICAL_PROBE_SELF_TEST=1 python3 probes/python/runtime_probe.py
      - name: TypeScript runtime probe self-test
        run: CANONICAL_PROBE_SELF_TEST=1 node probes/typescript/runtime-probe.mjs

  audit:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings
