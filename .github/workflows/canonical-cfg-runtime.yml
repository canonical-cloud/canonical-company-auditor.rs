name: Canonical audit config runtime admission

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cli-flags.toml"
      - "src/audit_config.rs"
      - "src/app.rs"
      - "src/cli.rs"
      - "src/lib.rs"
      - ".github/workflows/canonical-cfg-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Generate deterministic lockfile candidate
        run: cargo generate-lockfile
      - name: Retain generated lockfile for exact-head reconciliation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-cfg-lock-${{ github.run_id }}
          path: Cargo.lock
          retention-days: 7
      - name: Require committed lockfile parity
        run: git diff --exit-code -- Cargo.lock
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
