[package]
name = "canonical-company-auditor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust-first whole-company compliance assessment, evidence, findings, reports, webhooks, and runtime probes"
license = "Apache-2.0"
repository = "https://github.com/canonical-cloud/canonical-company-auditor.rs"
publish = false

[[bin]]
name = "canonical-auditor"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "4eb9360d418ed64de994e4b1d6e43e7063219e02" }
hex = "0.4.3"
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
proptest = "1.9.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
